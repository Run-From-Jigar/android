name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you also trigger it manually from the Actions tab, no push needed

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # ubuntu-latest ships with an Android SDK already installed here —
      # no need for the android-actions/setup-android action, whose
      # legacy "tools" package install has been broken since Google
      # removed that package from the SDK repository.
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required SDK packages
        run: |
          yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
